name: Feature request
description: Propose a focused addition that preserves Second Wind's safety model
title: "Proposal: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What local storage task is currently difficult to understand or complete?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Review, Recovery, and privacy impact
      description: Explain how the proposal remains explicit, reversible where possible, deterministic, and local.
    validations:
      required: true
