name: SecondWind
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    macOS: "15.0"
packages:
  SecondWindCore:
    path: ..
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: org.secondwind.app
    MARKETING_VERSION: "0.9.0"
    CURRENT_PROJECT_VERSION: 10
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_VERSION: "5.9"
targets:
  SecondWind:
    type: application
    platform: macOS
    sources:
      - path: ../Sources/UI
    dependencies:
      - target: SecondWindPrivilegedHelper
      - package: SecondWindCore
        product: SecondWindCore
      - package: SecondWindCore
        product: SecondWindApplication
      - package: SecondWindCore
        product: SecondWindPersistence
      - package: SecondWindCore
        product: SecondWindMacOS
      - package: SecondWindCore
        product: SecondWindServices
    settings:
      base:
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/SecondWind.entitlements
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 33474MTKLP
        PRODUCT_BUNDLE_IDENTIFIER: org.secondwind.app
      configs:
        Debug:
          ENABLE_DEBUG_DYLIB: NO
    postBuildScripts:
      - name: Embed privileged helper
        script: |
          "${SRCROOT}/../Scripts/embed-privileged-helper.sh"
  SecondWindPrivilegedHelper:
    type: tool
    platform: macOS
    sources:
      - path: ../Sources/PrivilegedHelperService
    dependencies:
      - package: SecondWindCore
        product: SecondWindCore
      - package: SecondWindCore
        product: SecondWindMacOS
    settings:
      base:
        INFOPLIST_FILE: Config/Helper-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/PrivilegedMaintenanceHelper.entitlements
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 33474MTKLP
        PRODUCT_BUNDLE_IDENTIFIER: org.secondwind.PrivilegedMaintenanceHelper
        MACH_O_TYPE: mh_execute
schemes:
  App:
    build:
      targets:
        SecondWind: all
    run:
      config: Debug
  ExperimentalPrivilegedHelper:
    build:
      targets:
        SecondWindPrivilegedHelper: all
    run:
      config: Release
